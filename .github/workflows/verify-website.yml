name: Verify website
on:
  pull_request:
permissions:
  contents: read
jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run generate
        env:
          SITE_URL: https://amkargar.github.io
          NUXT_APP_BASE_URL: /GoNex-website/
          PUBLIC_INDEXING: 'true'
      - name: Verify generated AI prompt
        run: |
          test -s .output/public/ai/main.txt
          grep -q 'transport.Routes' .output/public/ai/main.txt
          grep -q 'MY APP REQUIREMENTS' .output/public/ai/main.txt
          grep -q 'DEBUG=false' .output/public/ai/main.txt
          test -s .output/public/docs/main/debug/index.html
      - name: Inspect generated metadata
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess, base64
          for name in subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines():
              print('GENERATED_FILE ' + name + ' ' + base64.b64encode(open(name, 'rb').read()).decode())
          PY
          git diff --exit-code
